
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-tools"
version = "0.1.0"
description = "Classical cryptography tools"
authors = [
    { name = "Andrew Jia", email = "andrew.jia2022@gmail.com" },
    { name = "Lei Xue", email = "andrew.jia2022@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
